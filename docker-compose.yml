# backend/frontend run natively during development (uvicorn / npm run dev) against this DB;
# containerized backend/frontend services get added once their Dockerfiles exist (later milestone).
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: text2sql-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-text2sql}
      POSTGRES_USER: ${DB_USER:-text2sql}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-text2sql}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-text2sql} -d ${DB_NAME:-text2sql}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
