[project]
name = "text2sql-backend"
version = "0.1.0"
description = "Text2SQL pipeline: hybrid retrieval -> schema linking -> generation -> execution -> self-repair (LangGraph), served via FastAPI."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "asyncpg>=0.30",
    "psycopg2-binary>=2.9",
    "pgvector>=0.3",
    "anthropic>=0.39",
    "openai>=1.54",
    "langgraph>=0.2",
    "sqlglot>=25.0",
    "sentence-transformers>=3.2",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]
